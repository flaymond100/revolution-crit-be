openapi: 3.0.3
info:
  title: Revolution Crit BE API
  version: 1.0.0
  description: Public API for auth, race registration checkout, and Stripe webhook handling.
servers:
  - url: http://localhost:3003
    description: Local development
  - url: https://revolution-crit-be.onrender.com
    description: Production

tags:
  - name: health
  - name: auth
  - name: payments

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /test:
    get:
      tags: [health]
      summary: Public test endpoint
      responses:
        '200':
          description: Test response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: API is reachable

  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Supabase registration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Log out
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/create-payment-intent:
    post:
      tags: [payments]
      summary: Create Stripe Checkout session
      description: Accepts snake_case or camelCase payload keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreatePaymentIntentRequestCamel'
                - $ref: '#/components/schemas/CreatePaymentIntentRequestSnake'
      responses:
        '201':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkoutUrl:
                    type: string
                    format: uri
                  sessionId:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Failed to create checkout session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/webhook:
    post:
      tags: [payments]
      summary: Stripe webhook endpoint
      description: |
        This endpoint expects Stripe's raw signed payload.
        Do not call this from frontend clients.
      parameters:
        - in: header
          name: stripe-signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        '400':
          description: Invalid Stripe signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Webhook processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    AuthResponse:
      type: object
      properties:
        user:
          type: object
          additionalProperties: true
        session:
          type: object
          nullable: true
          additionalProperties: true

    ParticipantCamel:
      type: object
      required: [fullName, email]
      properties:
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        teamName:
          type: string
        nationality:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    ParticipantSnake:
      type: object
      required: [full_name, email]
      properties:
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        team_name:
          type: string
        nationality:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    CreatePaymentIntentRequestCamel:
      type: object
      required: [amount, currency, subRaceId, participant, successUrl, cancelUrl]
      properties:
        amount:
          type: integer
          minimum: 1
          description: Amount in smallest currency unit (e.g., cents)
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: usd
        subRaceId:
          type: string
          format: uuid
        participant:
          $ref: '#/components/schemas/ParticipantCamel'
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri

    CreatePaymentIntentRequestSnake:
      type: object
      required: [amount, currency, sub_race_id, participant, success_url, cancel_url]
      properties:
        amount:
          type: integer
          minimum: 1
          description: Amount in smallest currency unit (e.g., cents)
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: usd
        sub_race_id:
          type: string
          format: uuid
        participant:
          $ref: '#/components/schemas/ParticipantSnake'
        success_url:
          type: string
          format: uri
        cancel_url:
          type: string
          format: uri

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
